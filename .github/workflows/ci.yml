name: CI

on:
  push:
    branches: [main, dotnet-port]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore PanoramaBridge.sln

      - name: Build
        run: dotnet build PanoramaBridge.sln -c Release --no-restore

      # Unlike the Python release workflow this replaces, a failing test fails the build.
      # That workflow ran pytest with continue-on-error, so releases shipped regardless.
      - name: Test
        run: dotnet test PanoramaBridge.sln -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/
          retention-days: 14

      # Smoke test the exact publish shape that vpk packs, so packaging breakage is caught
      # on every push rather than at release time.
      - name: Publish smoke test
        run: >
          dotnet publish src/PanoramaBridge.App/PanoramaBridge.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishReadyToRun=true
          -o artifacts/publish

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: PanoramaBridge-win-x64-${{ github.sha }}
          path: artifacts/publish/
          retention-days: 14

  # A second job on Linux, because the tray-free half of this repository claims to be
  # cross-platform and a claim nothing exercises is a claim. It also produces the standalone
  # thermoraw-check binaries, so there is always a build to hand someone between releases.
  thermoraw:
    name: thermoraw-check on Linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      # The solution cannot be restored here: the WPF projects target net8.0-windows. These two
      # are named explicitly, which is the point -- they must not acquire a Windows dependency.
      - name: Build
        run: |
          dotnet build src/PanoramaBridge.ThermoRaw/PanoramaBridge.ThermoRaw.csproj -c Release
          dotnet build src/PanoramaBridge.ThermoRawCheck/PanoramaBridge.ThermoRawCheck.csproj -c Release
          dotnet build src/PanoramaBridge.ThermoRaw.Tests/PanoramaBridge.ThermoRaw.Tests.csproj -c Release

      - name: Test
        run: >
          dotnet test src/PanoramaBridge.ThermoRaw.Tests/PanoramaBridge.ThermoRaw.Tests.csproj
          -c Release --no-build

      - name: Publish standalone binaries
        run: |
          project=src/PanoramaBridge.ThermoRawCheck/PanoramaBridge.ThermoRawCheck.csproj
          for rid in win-x64 linux-x64; do
            dotnet publish "$project" -c Release -r "$rid" -o "artifacts/thermoraw-check/$rid"
          done
          rm -f artifacts/thermoraw-check/*/*.pdb
          ls -la artifacts/thermoraw-check/*

      # Smoke test on the platform it was built for. A trimmed binary can build clean and fail on
      # first use, because trimming removes what only reflection referenced.
      - name: Run it
        run: |
          chmod +x artifacts/thermoraw-check/linux-x64/thermoraw-check
          artifacts/thermoraw-check/linux-x64/thermoraw-check --help
          head -c 5000 /dev/urandom > not-a-raw.raw
          artifacts/thermoraw-check/linux-x64/thermoraw-check --json not-a-raw.raw

      - name: Upload standalone binaries
        uses: actions/upload-artifact@v7
        with:
          name: thermoraw-check-${{ github.sha }}
          path: artifacts/thermoraw-check/
          retention-days: 14
