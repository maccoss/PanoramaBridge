# Release - triggered by a v* tag.
#
# Pushing the tag both builds the artifacts and creates the GitHub Release. Do not hand-create
# the Release. See release-notes/README.md for the full process.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, pack and publish
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      # The version lives in exactly one place, Directory.Build.props. For a tagged build the
      # tag must agree with it, so the assembly version, the package version and the release
      # name can never drift apart.
      #
      # Channel and prerelease are independent, and the split matters:
      #   channel     decides WHO receives the update. Stable installs read releases.win.json;
      #               a beta tag publishes releases.win-beta.json for pilot machines only.
      #   prerelease  decides only HOW the Release is presented on GitHub.
      # The client sets GithubSource(prerelease: true) so the flag never silently gates
      # delivery -- see UpdateService for why.
      - name: Resolve and verify version
        id: meta
        shell: bash
        run: |
          PROPS=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | tr -d '[:space:]')
          if [ -z "$PROPS" ]; then
            echo "::error::Could not read <Version> from Directory.Build.props"
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$PROPS" ]; then
              echo "::error::Directory.Build.props Version ($PROPS) does not match tag ($TAG). Bump the property, commit, then re-tag."
              exit 1
            fi
            VERSION="$TAG"
          else
            VERSION="$PROPS"
          fi

          case "$VERSION" in
            *beta*) CHANNEL=win-beta ;;
            *)      CHANNEL=win ;;
          esac

          case "$VERSION" in
            *alpha*|*beta*|*rc*) PRERELEASE=true ;;
            *)                   PRERELEASE=false ;;
          esac

          {
            echo "version=$VERSION"
            echo "channel=$CHANNEL"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "version=$VERSION channel=$CHANNEL prerelease=$PRERELEASE"

      # Resolved from the version so the path cannot drift from the tag. Failing here, before
      # the long build, beats dying at the publish step or silently shipping an empty release.
      - name: Locate the release notes
        id: notes
        shell: bash
        run: |
          NOTES="release-notes/RELEASE_NOTES_v${{ steps.meta.outputs.version }}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::Expected release notes at $NOTES. Rename the draft (release-notes/RELEASE_NOTES_next.md) to match the version before tagging - see release-notes/README.md."
            exit 1
          fi
          echo "Using release notes: $NOTES ($(wc -l < "$NOTES") lines)"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test PanoramaBridge.sln -c Release

      - name: Publish
        run: >
          dotnet publish src/PanoramaBridge.App/PanoramaBridge.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishReadyToRun=true
          -o artifacts/publish

      - name: Install vpk
        run: dotnet tool install -g vpk

      # vpk builds a delta by diffing against a previous full package sitting in the output
      # directory. A CI runner starts empty, so without this step every release ships as a
      # 66 MB full download and the delta mechanism silently does nothing. Both variants are
      # attempted because --pre selects either the latest stable or the latest prerelease, and
      # the previous release may be either -- notably at the seam where an rc line becomes
      # stable. Failure is expected and ignored for the very first release on a channel.
      - name: Download the previous release as a delta base
        continue-on-error: true
        shell: bash
        run: |
          for pre in false true; do
            vpk download github               --repoUrl "https://github.com/${{ github.repository }}"               --token "${{ secrets.GITHUB_TOKEN }}"               --channel "${{ steps.meta.outputs.channel }}"               --outputDir artifacts/releases               --pre "$pre" || echo "No previous release found (pre=$pre); this is fine."
          done
          ls -la artifacts/releases 2>/dev/null || echo "(no previous releases)"

      # Delta packages are why the publish output is a folder rather than a single file:
      # a full package is ~66 MB, a delta between adjacent versions is a few hundred KB.
      - name: Pack
        shell: pwsh
        run: |
          $sign = @()
          if ($env:SIGNING_CERT_BASE64) {
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
            $sign = @('--signParams', "/f $env:RUNNER_TEMP\cert.pfx /p $env:SIGNING_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256")
          } else {
            Write-Warning "No signing certificate configured; this build is unsigned and will trigger SmartScreen."
          }

          vpk pack `
            --packId MacCossLab.PanoramaBridge `
            --packVersion ${{ steps.meta.outputs.version }} `
            --packDir artifacts/publish `
            --mainExe PanoramaBridge.exe `
            --packTitle "PanoramaBridge" `
            --packAuthors "MacCoss Lab, University of Washington" `
            --icon src/PanoramaBridge.App/Assets/panoramabridge.ico `
            --releaseNotes ${{ steps.notes.outputs.notes }} `
            --channel ${{ steps.meta.outputs.channel }} `
            --outputDir artifacts/releases `
            @sign
        env:
          SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}

      # Written outside artifacts/releases: vpk uploads only the assets it produced, and a
      # stray file in its output directory is ignored. It is attached separately below.
      #
      # Packages from earlier releases are present as delta bases, so they are filtered out --
      # only this version's assets belong in this release's checksum list.
      - name: Checksums
        shell: pwsh
        run: |
          $version = '${{ steps.meta.outputs.version }}'
          Get-ChildItem artifacts/releases -File |
            Where-Object { $_.Extension -ne '.nupkg' -or $_.Name -like "*-$version-*" } |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content artifacts/SHA256SUMS.txt
          Get-Content artifacts/SHA256SUMS.txt

      # vpk creates the Release so that releases.<channel>.json and the packages land together;
      # updates will not resolve if the feed and the assets are published separately.
      # --merge allows a second channel to be added to an existing Release for the same tag.
      - name: Upload to GitHub Releases
        shell: pwsh
        run: |
          $arguments = @(
            'upload', 'github',
            '--repoUrl',     'https://github.com/${{ github.repository }}',
            '--token',       '${{ secrets.GITHUB_TOKEN }}',
            '--outputDir',   'artifacts/releases',
            '--channel',     '${{ steps.meta.outputs.channel }}',
            '--tag',         'v${{ steps.meta.outputs.version }}',
            '--releaseName', 'PanoramaBridge ${{ steps.meta.outputs.version }}',
            '--merge',
            '--publish'
          )
          if ('${{ steps.meta.outputs.prerelease }}' -eq 'true') { $arguments += '--pre' }

          vpk @arguments

      # vpk does not take a release body, so the notes file is applied afterwards. It is
      # published verbatim, which is why release-notes/README.md insists it be written for the
      # people reading the Releases page.
      # Built here rather than reused from CI so a release is reproducible from its tag alone.
      # Trimmed and self-contained: one file, no .NET install, for anyone who wants to check a
      # RAW file without installing PanoramaBridge.
      - name: Publish thermoraw-check for both platforms
        shell: pwsh
        run: |
          $project = 'src/PanoramaBridge.ThermoRawCheck/PanoramaBridge.ThermoRawCheck.csproj'
          foreach ($rid in @('win-x64', 'linux-x64')) {
            dotnet publish $project -c Release -r $rid -o "artifacts/thermoraw-check/$rid"
            if ($LASTEXITCODE -ne 0) { throw "publishing thermoraw-check for $rid failed" }
          }
          New-Item -ItemType Directory -Force artifacts/tools | Out-Null
          Copy-Item artifacts/thermoraw-check/win-x64/thermoraw-check.exe `
                    artifacts/tools/thermoraw-check-win-x64.exe
          Copy-Item artifacts/thermoraw-check/linux-x64/thermoraw-check `
                    artifacts/tools/thermoraw-check-linux-x64
          Get-ChildItem artifacts/tools | Format-Table Name, Length

      - name: Attach checksums and set the release description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v${{ steps.meta.outputs.version }} artifacts/SHA256SUMS.txt --clobber
          gh release upload v${{ steps.meta.outputs.version }} artifacts/tools/thermoraw-check-win-x64.exe artifacts/tools/thermoraw-check-linux-x64 --clobber
          gh release edit v${{ steps.meta.outputs.version }} --notes-file ${{ steps.notes.outputs.notes }}
