name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without a leading v (e.g. 1.0.0)"
        required: true
      prerelease:
        description: "Publish to the beta channel instead of stable"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build, pack and publish
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # One source of truth for the version: the tag (or the manual input) flows into the
      # assembly and into --packVersion. Nothing is hardcoded in a csproj.
      - name: Resolve version and channel
        id: meta
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF -replace '^refs/tags/v', ''
            $pre = $version -match '-'
          } else {
            $version = '${{ inputs.version }}'
            $pre = '${{ inputs.prerelease }}' -eq 'true'
          }
          $channel = if ($pre) { 'win-beta' } else { 'win' }
          "version=$version"   >> $env:GITHUB_OUTPUT
          "channel=$channel"   >> $env:GITHUB_OUTPUT
          "prerelease=$($pre.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Building $version on channel $channel"

      - name: Test
        run: dotnet test PanoramaBridge.sln -c Release

      - name: Publish
        run: >
          dotnet publish src/PanoramaBridge.App/PanoramaBridge.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishReadyToRun=true
          -p:Version=${{ steps.meta.outputs.version }}
          -o artifacts/publish

      - name: Install vpk
        run: dotnet tool install -g vpk

      - name: Write release notes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          @"
          ## PanoramaBridge ${{ steps.meta.outputs.version }}

          Installed per-user with no administrator rights. Existing installations update
          themselves in the background and apply the update on the next restart.
          "@ | Set-Content artifacts/release-notes.md

      # Delta packages are why the publish output is a folder rather than a single file:
      # a full package is ~66 MB, a delta between adjacent versions is a few hundred KB.
      - name: Pack
        shell: pwsh
        run: |
          $sign = @()
          if ($env:SIGNING_CERT_BASE64) {
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
            $sign = @('--signParams', "/f $env:RUNNER_TEMP\cert.pfx /p $env:SIGNING_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256")
          } else {
            Write-Warning "No signing certificate configured; the build will be unsigned and will trigger SmartScreen."
          }

          vpk pack `
            --packId MacCossLab.PanoramaBridge `
            --packVersion ${{ steps.meta.outputs.version }} `
            --packDir artifacts/publish `
            --mainExe PanoramaBridge.exe `
            --packTitle "PanoramaBridge" `
            --packAuthors "MacCoss Lab, University of Washington" `
            --icon src/PanoramaBridge.App/Assets/panoramabridge.ico `
            --releaseNotes artifacts/release-notes.md `
            --channel ${{ steps.meta.outputs.channel }} `
            --outputDir artifacts/releases `
            @sign
        env:
          SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem artifacts/releases -File |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content artifacts/releases/SHA256SUMS.txt

      # --merge lets a channel be added to an existing release for the same tag; Velopack
      # requires one full package and one delta per release for updates to resolve.
      - name: Upload to GitHub Releases
        run: >
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --outputDir artifacts/releases
          --channel ${{ steps.meta.outputs.channel }}
          --tag v${{ steps.meta.outputs.version }}
          --releaseName "PanoramaBridge ${{ steps.meta.outputs.version }}"
          --merge
          --publish
          ${{ steps.meta.outputs.prerelease == 'true' && '--pre' || '' }}
